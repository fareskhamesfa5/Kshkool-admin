<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#100b1c"><title>Koshkool Admin</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-brand">
      <div class="brand-mark">K</div>
      <p class="eyebrow">KOSHKOOl CONTROL CENTER</p>
      <h1>إدارة كشكول</h1>
      <p class="muted">مساحة منظمة لإدارة المنصة التعليمية ومتابعة كل ما يحدث داخلها.</p>
      <div class="brand-note"><span class="pulse"></span> لوحة تحكم المشرفين</div>
    </section>
    <section class="login-card">
      <div class="card-top"><span class="tag">ADMIN ACCESS</span><span class="lock">⌑</span></div>
      <h2>تسجيل الدخول</h2><p class="muted">أدخل بيانات حساب الإدارة للمتابعة.</p>
      <form id="loginForm">
        <label for="username">اسم المستخدم</label><input id="username" autocomplete="username" placeholder="مثال: faress5" required>
        <label for="adminId">الرقم التعريفي</label><input id="adminId" inputmode="numeric" autocomplete="off" placeholder="الرقم التعريفي" required>
        <label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
        <button class="btn primary full" type="submit">دخول إلى لوحة التحكم <span>←</span></button>
        <p id="loginMessage" class="message" role="status"></p>
      </form>
      <p class="tiny muted">الدخول مخصص لحسابات الإدارة المعتمدة فقط.</p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script><script src="js/login.js"></script>
</body></html>
